[project]
name = "rastrohg"
version = "0.1.0"
description = "RastroHg: backend y motor estadístico para mercurio de minería aurífera en Bolivia"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    # Base de datos y colas
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "rq>=2.0",
    # Motor estadístico y geoespacial
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "h3>=4.1",
    "earthengine-api>=1.4",
    # Utilidades
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pillow>=11.0",
    "pymupdf>=1.25",
    "openai>=1.99",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
rastrohg = "rastrohg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rastrohg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
